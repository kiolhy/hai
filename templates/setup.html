<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hai · 初始化</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;font-family:system-ui,"Microsoft YaHei",sans-serif}.box{background:#161b22;border:1px solid #21262d;border-radius:14px;padding:26px 28px;width:340px}h1{font-size:18px;margin:0 0 6px}p.mut{color:#8b949e;font-size:13px;margin:0 0 16px}input{width:100%;box-sizing:border-box;padding:10px 12px;margin:8px 0;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}button{width:100%;padding:10px;margin-top:10px;border:0;border-radius:8px;background:#238636;color:#fff;font-weight:600;cursor:pointer}.err{color:#f85149;font-size:13px;margin-top:8px}</style></head>
<body><div class="box"><h1>🌾 hai 初始化</h1><p class="mut">首次使用：设置站点访问密码（≥8位）。之后进入网站需登录。</p>
<form method="post" action="/setup"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input type="{{ ptype }}" name="pw" placeholder="设置访问密码" required>
<input type="{{ ptype }}" name="pw2" placeholder="再次输入" required>
<button type="submit">创建并进入</button></form>
{% if err %}<div class="err">{{ err }}</div>{% endif %}</div></body></html>
