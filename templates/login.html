<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hai · 登录</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;font-family:system-ui,"Microsoft YaHei",sans-serif}.box{background:#161b22;border:1px solid #21262d;border-radius:14px;padding:26px 28px;width:340px}h1{font-size:18px;margin:0 0 16px}input{width:100%;box-sizing:border-box;padding:10px 12px;margin:8px 0;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}button{width:100%;padding:10px;margin-top:10px;border:0;border-radius:8px;background:#1f6feb;color:#fff;font-weight:600;cursor:pointer}.err{color:#f85149;font-size:13px;margin-top:8px}</style></head>
<body><div class="box"><h1>🔒 进入 hai 看板</h1>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input type="{{ ptype }}" name="pw" placeholder="访问密码" autofocus required>
<button type="submit">登录</button></form>
{% if err %}<div class="err">{{ err }}</div>{% endif %}</div></body></html>
